<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #d90429 0%, #ff6b6b 25%, #f72585 50%, #ff9a9e 100%);
            overflow: hidden;
            color: #fff;
            text-align: center;
            padding: 15px;
        }
        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 18px;
            animation: float 6s infinite linear;
        }
        .heart:before, .heart:after {
            content: '';
            width: 10px;
            height: 16px;
            position: absolute;
            left: 10px;
            transform: rotate(-45deg);
            background: #ff416c;
            border-radius: 10px 10px 0 0;
            transform-origin: 0 100%;
        }
        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }
        .greeting {
            font-size: clamp(1.6em, 8vw, 2.5em);
            margin-bottom: 0.5em;
            z-index: 10;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
            color: #ffd700;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 2px 2px 8px rgba(0,0,0,0.6), 0 0 20px #ffd700; }
            to { text-shadow: 2px 2px 8px rgba(0,0,0,0.6), 0 0 30px #ffd700; }
        }
        h1 {
            font-size: clamp(1.8em, 9vw, 3em);
            margin: 0.8em 0 2em 0;
            z-index: 10;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.6);
            font-weight: bold;
            line-height: 1.2;
        }
        .buttons {
            z-index: 20;
            width: 100%;
            max-width: 450px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 10px;
        }
        button {
            flex: 1;
            min-width: 130px;
            padding: clamp(16px, 5vw, 20px) clamp(25px, 8vw, 35px);
            font-size: clamp(1.1em, 6vw, 1.5em);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            touch-action: manipulation;
            min-height: 65px;
            -webkit-tap-highlight-color: transparent;
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff416c, #ff4d6d, #ff78a0);
            color: white;
        }
        #yesBtn:hover, #yesBtn:active {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255,65,108,0.6);
        }
        #noBtn {
            background: linear-gradient(45deg, #ffd23f, #ffed4e);
            color: #8b4513;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        #message {
            display: none;
            font-size: clamp(1.8em, 9vw, 2.5em);
            z-index: 15;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
            line-height: 1.3;
            animation: lovePulse 1.5s ease-in-out infinite;
            padding: 0 10px;
        }
        .swetha-name {
            color: #ffd700;
            font-size: 1.4em;
            text-shadow: 0 0 25px rgba(255,215,0,1);
            display: block;
        }
