<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #d90429 0%, #ff6b6b 25%, #f72585 50%, #ff9a9e 100%);
            overflow: hidden;
            position: relative;
            color: #fff;
            text-align: center;
        }
        /* Floating hearts background */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .heart {
            position: absolute;
            width: 25px;
            height: 23px;
            animation: float 5s infinite linear;
        }
        .heart:before,
        .heart:after {
            content: '';
            width: 12px;
            height: 20px;
            position: absolute;
            left: 12px;
            transform: rotate(-45deg);
            background: #ff416c;
            border-radius: 12px 12px 0 0;
            transform-origin: 0 100%;
        }
        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }
        h1 {
            font-size: 2.8em;
            margin-bottom: 2em;
            z-index: 10;
            position: relative;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            font-weight: bold;
        }
        .buttons {
            position: relative;
            z-index: 10;
        }
        button {
            padding: 18px 35px;
            font-size: 1.3em;
            margin: 0 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            font-family: 'Georgia', serif;
            font-weight: bold;
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff416c, #ff4d6d, #ff78a0);
            color: white;
        }
        #yesBtn:hover {
            transform: scale(1.15) rotate(2deg);
            box-shadow: 0 8px 25px rgba(255,65,108,0.5);
        }
        #noBtn {
            background: linear-gradient(45deg, #ffd23f, #ffed4e);
            color: #8b4513;
            position: absolute;
            top: 0;
            left: 220px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        #message {
            display: none;
            font-size: 1.8em;
            margin-top: 2em;
            animation: pulse 1.2s infinite;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .hearts-yes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .heart-yes {
            position: absolute;
            font-size: 35px;
            animation: heartsFloat 2.5s infinite linear;
            color: #ff69b4;
            text-shadow: 0 0 10px rgba(255,105,180,0.8);
        }
        @keyframes heartsFloat {
            0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(50vh) scale(1.2) rotate(180deg); }
            100% { transform: translateY(-100px) scale(0.5) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="bgHearts"></div>
    <h1>Will you be my Valentine? 💕</h1>
    <div class="buttons">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No</button>
    </div>
    <div id="message">Thank you so much <span style="color: #ffd700; font-size: 2em;">Swetha</span>, I love you so much! 💖💖💖</div>
    <div class="hearts-yes" id="yesHearts"></div>

    <script>
        // Background floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 2 + 4) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('bgHearts').appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 250);

        // No button dodge (faster + smarter)
        const noBtn = document.getElementById('noBtn');
        let dodgeCount = 0;
        noBtn.addEventListener('mouseenter', function() {
            dodgeCount++;
            const maxX = window.innerWidth - 140;
            const maxY = window.innerHeight - 120;
            const dodgeX = Math.random() * maxX;
            const dodgeY = Math.random() * maxY;
            this.style.left = dodgeX + 'px';
            this.style.top = dodgeY + 'px';
            this.textContent = dodgeCount > 5 ? '😏 Stop chasing me!' : 'No';
        });

        // Yes button - celebration
        document.getElementById('yesBtn').addEventListener('click', function() {
            document.querySelector('h1').style.display = 'none';
            document.querySelector('.buttons').style.display = 'none';
            document.getElementById('message').style.display = 'block';
            createYesHearts();
        });

        // Enhanced yes hearts explosion
        function createYesHearts() {
            const container = document.getElementById('yesHearts');
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = ['💖', '💕', '💗', '💝', '🌹'][Math.floor(Math.random()*5)];
                    heart.className = 'heart-yes';
                    heart.style.left = (50 + (Math.random() - 0.5) * 100) + '%';
                    heart.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                    container.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
